<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c1311">
<title>Escape the Sanctuary — Plague Protocol</title>
<style>
:root{
  --soot:#1c1311; --soot2:#2a1c17; --leather:#33221a; --ox:#6b1f22; --ox-dark:#3d0f12;
  --brass:#c9a25a; --brass-hi:#f0cf86; --parch:#ecdfc2; --parch2:#dcc79f;
  --ink:#2b1a12; --ink-soft:#5f4532; --blood:#8e2129;
  --serif:"Palatino Linotype","Book Antiqua",Palatino,"URW Palladio L",P052,Georgia,serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:#120c0a radial-gradient(ellipse at 50% 0,#3a2219 0,#1c1311 55%,#0f0908 100%) fixed;color:var(--parch);font:17px/1.5 var(--serif)}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;
  padding:6px max(10px,env(safe-area-inset-right)) 6px max(10px,env(safe-area-inset-left));
  padding-top:max(6px,env(safe-area-inset-top));
  background:linear-gradient(#4a1518,#2a0c0e);border-bottom:2px solid #7d5a2f;box-shadow:0 3px 12px rgba(0,0,0,.6)}
.title{flex:1;min-width:0;line-height:1.15}
.title b{display:block;font-weight:normal;font-style:italic;font-size:18px;color:var(--brass-hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title span{display:block;font-size:13px;color:#d8bf98;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{position:relative;flex:0 0 auto;min-width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;
  border:1px solid #9c7740;border-radius:22px;background:linear-gradient(#5a3a22,#33200f);color:#f6e2b8;font-size:15px;cursor:pointer}
.tbtn svg{width:20px;height:20px}
.tbtn.icon{padding:0;width:44px}
.badge{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--blood);border:1px solid #f0cf86;color:#fff;font-size:11px;line-height:17px;text-align:center;font-family:Georgia,serif}
.badge:empty{display:none}

/* ---------- room artwork ---------- */
main{width:100%;max-width:560px;margin:0 auto;padding-bottom:max(84px,calc(env(safe-area-inset-bottom) + 84px))}
.stage{position:relative;width:100%;line-height:0;background:#000;box-shadow:0 8px 30px rgba(0,0,0,.7)}
.stage>img{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}

.hs{position:absolute;width:44px;height:44px;margin:0;padding:0;border:0;background:none;transform:translate(-50%,-50%);
  display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:3}
.hs.compact{width:36px;height:36px}
.lens{width:25px;height:25px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 38% 32%,#4a3324 0,#150c08 72%);border:1.5px solid var(--brass-hi);
  box-shadow:0 0 0 2px rgba(0,0,0,.6),0 0 9px 2px rgba(255,186,90,.55);animation:glint 3.2s ease-in-out infinite}
.hs:nth-child(2n) .lens{animation-delay:-1.1s}.hs:nth-child(3n) .lens{animation-delay:-2.2s}
.lens svg{width:14px;height:14px}
.hs:hover .lens,.hs:focus-visible .lens{transform:scale(1.15);border-color:#fff}
.hs:focus-visible{outline:none}.hs:focus-visible .lens{outline:2px solid #fff;outline-offset:3px}
@keyframes glint{0%,100%{box-shadow:0 0 0 2px rgba(0,0,0,.6),0 0 7px 1px rgba(255,186,90,.4)}50%{box-shadow:0 0 0 2px rgba(0,0,0,.6),0 0 13px 4px rgba(255,200,110,.8)}}

/* stained-glass sockets (room 4) */
.sock{position:absolute;width:13%;height:8.667%;transform:translate(-50%,-50%);border-radius:50%;border:0;padding:0;margin:0;background:transparent;cursor:pointer;z-index:2}
.sock svg{display:block;width:100%;height:100%;filter:drop-shadow(0 0 6px rgba(0,0,0,.6))}
.sock.armed{box-shadow:0 0 0 2px var(--brass-hi),0 0 18px 5px rgba(255,205,120,.7);animation:arm 1.4s ease-in-out infinite}
.sock:focus-visible{outline:2px dashed #fff;outline-offset:2px}
@keyframes arm{50%{box-shadow:0 0 0 2px #fff,0 0 26px 8px rgba(255,215,140,.9)}}
.stage.flash .sock svg{animation:flash .5s 3}
@keyframes flash{50%{filter:brightness(2.4) drop-shadow(0 0 14px #fff)}}
.glow{position:absolute;left:31%;top:28%;width:44%;height:40%;pointer-events:none;opacity:0;transition:opacity 2.5s ease;
  background:radial-gradient(ellipse at 50% 62%,rgba(255,244,214,.95) 0,rgba(255,206,120,.7) 30%,rgba(255,160,60,.25) 55%,rgba(255,150,50,0) 72%);mix-blend-mode:screen;z-index:1}
.stage.won .glow{opacity:1}

/* ---------- placing bar ---------- */
.placing{position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:25;width:min(540px,calc(100% - 16px));
  display:flex;align-items:center;gap:10px;padding:8px 8px 8px 10px;background:#2e1d14;border:1px solid var(--brass);border-radius:30px;box-shadow:0 6px 24px rgba(0,0,0,.7);font-size:15px}
.placing svg{width:38px;height:38px;flex:0 0 auto}
.placing p{margin:0;flex:1;line-height:1.25}
.placing[hidden]{display:none}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom));transform:translate(-50%,8px);z-index:60;max-width:calc(100% - 24px);
  padding:9px 16px;border-radius:20px;background:#2e1d14;border:1px solid var(--brass);color:#f6e2b8;font-size:15px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- dialogs ---------- */
.ov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));background:rgba(8,4,3,.74)}
.ov.sheetwrap{align-items:flex-end;padding:0}
.dlg{position:relative;width:min(520px,100%);max-height:calc(100vh - 20px);max-height:calc(100dvh - 20px);display:flex;flex-direction:column;
  color:var(--ink);border-radius:6px;overflow:hidden;
  background:#ecdfc2 radial-gradient(ellipse at 30% 10%,#f6ecd4 0,#e8d8b4 55%,#d6c08f 100%);
  box-shadow:0 0 0 1px #5b3f22,0 0 0 4px #2a1a10,0 0 0 5px #8a6a3a,0 18px 50px rgba(0,0,0,.85);animation:rise .18s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.dlg:focus{outline:none}
.dh{padding:14px 52px 4px 18px;flex:0 0 auto}
.dh h2{margin:0;font-weight:normal;font-style:italic;font-size:23px;line-height:1.2;color:var(--ox)}
.db{padding:4px 18px 10px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;flex:1 1 auto;min-height:0}
.db p{margin:8px 0}
.df{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:8px;padding:10px 18px 14px;border-top:1px solid rgba(91,63,34,.35);background:rgba(120,85,45,.08)}
.x{position:absolute;top:8px;right:8px;width:40px;height:40px;border-radius:50%;border:0;cursor:pointer;
  background:radial-gradient(circle at 40% 35%,#b23a3f,#6b1f22 60%,#40100f);color:#f7d9b0;font-size:20px;line-height:40px;box-shadow:0 2px 4px rgba(0,0,0,.4)}
.b{min-height:44px;padding:8px 15px;border-radius:4px;border:1px solid #5b3f22;background:#3c271a;color:#f6e6c6;cursor:pointer;font-size:16px}
.b.pri{background:linear-gradient(#86292d,#5c1719);border-color:#3d0f12}
.b.light{background:transparent;color:var(--ink);border-color:#8a6a48}
.b:disabled{opacity:.38;cursor:not-allowed}
.b:focus-visible,.x:focus-visible,.tbtn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.quote{margin:10px 0;padding:8px 12px;border-left:3px solid var(--blood);background:rgba(107,31,34,.08);font-style:italic}
.note{margin:10px 0;padding:8px 12px;border-radius:4px;background:#3c271a;color:#f6e6c6}
.note.bad{background:#5c1719}
.got{margin:10px 0;padding:8px 12px;border:1px dashed #8a6a48;border-radius:4px}
.muted{color:var(--ink-soft)}.small{font-size:14px}
/* table wrapper scrolls only as a last resort */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:15px;margin:6px 0}
th{text-align:left;font-weight:normal;font-style:italic;color:var(--ox);border-bottom:1.5px solid #8a6a48;padding:5px 4px}
td{padding:6px 4px;border-bottom:1px solid rgba(91,63,34,.3);vertical-align:top}
.code-in{width:100%;margin:6px 0;padding:10px;font:28px/1.2 var(--serif);letter-spacing:.5em;text-align:center;color:var(--ink);background:#f8f0dd;border:2px solid #8a6a48;border-radius:4px}
.code-in:focus{outline:2px solid var(--ox)}

/* slot puzzles */
.slots{display:grid;gap:6px;margin:10px 0}
.slots.s3{grid-template-columns:repeat(3,1fr)}.slots.s4{grid-template-columns:repeat(4,1fr)}
.slot{min-height:56px;padding:4px;border:1.5px dashed #8a6a48;border-radius:4px;background:rgba(255,255,255,.25);color:var(--ink);font-size:14px;line-height:1.2;cursor:pointer}
.slot.full{border-style:solid;background:#3c271a;color:#f6e6c6}
.slot small{display:block;color:inherit;opacity:.7;font-size:12px}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:8px 0}
.choices .b{font-size:15px;padding:6px 8px}

/* glass dialog */
.pieces{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:8px 0}
.pc{display:flex;align-items:center;gap:8px;min-height:48px;padding:4px 8px;border:1px solid #8a6a48;border-radius:4px;background:rgba(255,255,255,.3);color:var(--ink);font-size:14px;line-height:1.2;text-align:left;cursor:pointer}
.pc svg{width:34px;height:34px;flex:0 0 auto}
.pc.sel{outline:3px solid var(--ox);background:#f8eed6}
.pc:disabled{opacity:.5;cursor:default}
.pc small{display:block;opacity:.75;font-size:12px}
.cross{display:grid;grid-template-columns:repeat(3,76px);grid-template-rows:repeat(3,76px);justify-content:center;gap:4px;margin:10px auto}
.cs{border-radius:50%;border:2px dashed #8a6a48;background:rgba(40,25,15,.15);padding:0;cursor:pointer;color:var(--ink-soft);font-size:12px}
.cs svg{width:100%;height:100%;display:block}
.cs.full{border:2px solid #2a1a10}
.cs:nth-child(1){grid-area:1/2}.cs:nth-child(2){grid-area:2/3}.cs:nth-child(3){grid-area:3/2}.cs:nth-child(4){grid-area:2/1}

/* satchel sheet */
.sheet{width:min(560px,100%);max-height:78vh;max-height:78dvh;display:flex;flex-direction:column;color:var(--parch);
  background:#33221a linear-gradient(#3d281d,#26180f);border-top:3px solid var(--brass);border-radius:14px 14px 0 0;
  box-shadow:0 -10px 40px rgba(0,0,0,.8);padding-bottom:env(safe-area-inset-bottom);animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .dh h2{color:var(--brass-hi)}
.sheet .db{padding-bottom:16px}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:6px}
.it{display:flex;align-items:center;gap:8px;min-height:56px;padding:6px 10px;border:1px solid #7d5a2f;border-radius:6px;background:rgba(0,0,0,.25);color:#f6e2b8;text-align:left;cursor:pointer;font-size:15px;line-height:1.2}
.it .ic{font-size:24px;width:34px;text-align:center;flex:0 0 auto}
.it svg{width:34px;height:34px;flex:0 0 auto}
.it.sel{outline:2px solid var(--brass-hi)}
.sheet .muted{color:#c9ad86}

/* victory */
.win{text-align:center}
.esc{margin:10px auto;padding:10px;border:2px dashed var(--ox);font-size:24px;letter-spacing:2px;color:var(--ox);user-select:all;-webkit-user-select:all;word-break:break-all}

@media (max-width:370px){table{font-size:13.5px}th,td{padding:5px 3px}.db{padding-left:14px;padding-right:14px}.title b{font-size:16px}.title span{font-size:12px}.tbtn .lbl{display:none}.tbtn{padding:0;width:44px}.cross{grid-template-columns:repeat(3,68px);grid-template-rows:repeat(3,68px)}.dh h2{font-size:21px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="title"><b>Escape the Sanctuary</b><span id="roomlabel">Room 1 of 4: The Infirmary</span></div>
  <button class="tbtn icon" id="restartBtn" aria-label="Restart the game" title="Restart">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
  </button>
  <button class="tbtn" id="satchelBtn" aria-label="Open inventory">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M8 7V5.5a4 4 0 0 1 8 0V7"/><path d="M3.5 8h17l-1.3 11.2a2 2 0 0 1-2 1.8H6.8a2 2 0 0 1-2-1.8z"/><path d="M3.5 8 12 13l8.5-5"/><rect x="10.3" y="12.2" width="3.4" height="3" rx=".6"/></svg>
    <span class="lbl">Inventory</span><span class="badge" id="badge"></span>
  </button>
</header>
<main><div class="stage" id="stage"></div></main>
<div class="placing" id="placing" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="modal"></div>

<script>
'use strict';
/* =====================================================================
   ESCAPE THE SANCTUARY — PLAGUE PROTOCOL
   Content and logic preserved from the recovered implementation.
   ===================================================================== */
const KEY = 'gremlins-plague-protocol-pages-v2';
const ESCAPE_CODE = 'GREMLIN-ESCAPED';

/* ---------- state ---------- */
const fresh = () => ({v:2, room:1, items:[], flags:{}, brew:[], gate:[], found:[], glass:[null,null,null,null], selected:null, finished:false});
function load(){
  try{
    const r = JSON.parse(localStorage.getItem(KEY) || 'null');
    if(r && r.v === 2){
      const s = Object.assign(fresh(), r);
      if(![1,2,3,4].includes(s.room)) return fresh();
      for(const k of ['items','brew','gate','found']) if(!Array.isArray(s[k])) s[k] = [];
      if(!Array.isArray(s.glass) || s.glass.length !== 4) s.glass = [null,null,null,null];
      if(!s.flags || typeof s.flags !== 'object') s.flags = {};
      return s;
    }
  }catch(e){}
  return fresh();
}
let S = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const has = i => S.items.includes(i);
const give = i => { if(!has(i)) S.items.push(i); };
const take = i => { S.items = S.items.filter(x => x !== i); };
const flag = f => !!S.flags[f];
const setFlag = f => { S.flags[f] = true; };

/* ---------- static data ---------- */
const ROOM_NAMES = ['', 'The Infirmary', 'The Apothecary', 'The Main Sanctuary Hall', 'The Final Escape'];
const INTRO_TITLES = ['', 'Infirmary', 'The Apothecary', 'The Main Sanctuary Hall', 'The Sanctuary Entrance'];
const INTROS = ['',
  'Find who swallowed the false cure. Unlock the medicine chest.',
  'Investigate the experiments. Brew the only effective antidote.',
  'Revive the guard, repair the gate, and restore the watch.',
  'Restore the four witnesses around the cross. Break the last seal.'];

/* Magnifier centres, in percent of the 1024×1536 artwork. */
const HOTSPOTS = {
  1: [
    {id:'tapestry', name:'Tapestry', x:18, y:13},
    {id:'patients', name:'Patients', x:21, y:42},
    {id:'marks',    name:'Bed markings', x:41, y:46},
    {id:'door',     name:'Door to the Apothecary', x:87, y:28},
    {id:'chest',    name:'Medicine chest', x:79, y:62},
    {id:'ledger',   name:'Patient records (healer’s ledger)', x:45, y:65},
    {id:'guide',    name:'Treatment guide', x:19, y:68},
    {id:'cloth',    name:'Bloodstained cloth', x:51, y:80}
  ],
  2: [
    {id:'phial',       name:'Suspicious green phial', x:68, y:23},
    {id:'jars',        name:'Ingredient shelves', x:45, y:27},
    {id:'door',        name:'Doorway to the Main Hall', x:93, y:38},
    {id:'cauldron',    name:'Cauldron', x:41, y:50},
    {id:'breworder',   name:'Cauldron inscription', x:57, y:55},
    {id:'recipes',     name:'Old recipe book', x:79, y:67},
    {id:'experiments', name:'Experiment journal', x:20, y:69}
  ],
  3: [
    {id:'gate',     name:'Gate mechanism', x:60, y:27},
    {id:'guard',    name:'Sick guard', x:20, y:52},
    {id:'crates',   name:'Supply crates', x:68, y:56},
    {id:'cat',      name:'Pink cat and blankets', x:87, y:65},
    {id:'rusty',    name:'Rusty key and tiny chest', x:44, y:66},
    {id:'oldwatch', name:'Old watch ledger', x:31, y:73},
    {id:'desk',     name:'Guard’s desk', x:35, y:83}
  ],
  4: [
    {id:'window',    name:'Empty cross sockets', x:53.2, y:19.6, compact:true},
    {id:'notice',    name:'Quarantine notice', x:8, y:38},
    {id:'cabinet',   name:'Locked cabinet', x:94, y:47},
    {id:'exitdoor',  name:'Exit doors', x:53, y:55},
    {id:'lever',     name:'Mechanical lever', x:85, y:58},
    {id:'reliquary', name:'Reliquary', x:11, y:58},
    {id:'tile',      name:'Loose floor tile', x:63, y:88}
  ]
};
/* Inner glass discs measured on room4.png: [Top, Right, Bottom, Left] */
const SOCKETS = [{x:53.2,y:11.3},{x:65.3,y:19.6},{x:53.2,y:27.9},{x:41.2,y:19.6}];
const POS = ['Top','Right','Bottom','Left'];

const mappings = {Crow:4, Moon:8, Sun:1, Serpent:6, Gravebloom:7, Frostmoss:2, Emberroot:5, Silverleaf:9};
const ING = ['Silverleaf','Gravebloom','Emberroot','Frostmoss','Nightshade','Moonwater'];
const SYMS = ['Sun','Moon','Crow','Serpent'];

const GLASS = ['Gold','Red','Green','Blue'];
const GLASS_NAME = {Gold:'Unicorn', Red:'Plague Doctor', Green:'Gremlin', Blue:'Taco'};
const GLASS_COL = {Gold:['#ffe9a3','#d6a21e','#7a5608'], Red:['#ff9a9a','#b3232c','#5a0a10'], Green:['#a8f0b8','#2e9152','#0d4322'], Blue:['#a9c9ff','#2e63c0','#0c2a63']};
const pieceLabel = c => `${c} ${GLASS_NAME[c]}`;

const ITEMS = {
  apokey:     {name:'Apothecary key', icon:'🗝️', desc:'<p>A heavy iron key from the medicine chest. It should fit the apothecary door.</p>'},
  quarantine: {name:'Torn quarantine document', icon:'📜', desc:'<div class="quote">“The crimson witness shall forever face the azure witness across the holy cross.”</div>'},
  antidote:   {name:'Antidote', icon:'🧪', desc:'<p>The true cure. It glimmers silver.</p>'},
  diagram:    {name:'Stained-glass diagram', icon:'🗺️', desc:'<p>A sanctuary map fragment showing a stained-glass cross.</p><div class="quote">“Follow the sun’s path clockwise around the cross. The emerald witness comes directly after the crimson.”</div>'},
  ironkey:    {name:'Iron key', icon:'🔑', desc:'<p>A small iron key, retrieved from beneath the pink cat’s blankets.</p>'},
  orders:     {name:'Revised watch orders', icon:'📃', desc:'<div class="quote">“The Crow stands immediately before the Moon. The Moon takes the final watch.”</div>'},
  seal:       {name:'Watchman’s seal', icon:'🏵️', desc:'<p>On the reverse:</p><div class="quote">“The Serpent stands immediately before the Sun.”</div><p>A second, tiny engraving reads:</p><div class="quote">“The golden witness keeps vigil above all others.”</div>'},
  cog:        {name:'Brass cog', icon:'⚙️', desc:'<p>A brass cog from the false bottom of the supply crates. Something mechanical is missing one of these.</p>'}
};

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const table = (heads, rows) => `<div class="tw"><table><thead><tr>${heads.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const B = (label, fn, opt = {}) => ({label, fn, ...opt});
const CLOSE = () => B('Close', 'close', {light:true});
const MAG = '<svg viewBox="0 0 24 24" fill="none" stroke="#f0cf86" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="M14.6 14.6 20.5 20.5"/></svg>';

let svgN = 0;
function pieceSVG(c){
  const [hi, base, dark] = GLASS_COL[c]; const id = 'pg' + (svgN++);
  const sil = {
    Gold: `<path d="M30 13 L48 38 L43 41 Z"/><path d="M45 38C38 40 28 47 23 57C20 63 23 68 29 67C34 66 38 63 43 63C46 69 45 78 41 87L72 87C75 71 73 57 68 48C66 42 62 37 58 35L61 24L53 33C50 34 47 36 45 38Z"/><circle cx="44" cy="48" r="2.6" fill="${base}"/>`,

/* ---------- toast ---------- */
let toastT;
function toast(t){ const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2600); }

/* ---------- modal system ---------- */
let lastFocus = null;
function show(title, body, buttons, opts = {}){
  const m = $('modal');
  const wasOpen = !!m.firstChild;
  if(!wasOpen) lastFocus = document.activeElement;
  const btns = (buttons || [CLOSE()]).map(b => `<button class="b ${b.pri ? 'pri' : ''} ${b.light ? 'light' : ''}" data-fn="${esc(b.fn)}" ${b.disabled ? 'disabled' : ''}>${esc(b.label)}</button>`).join('');
  m.innerHTML = `<div class="ov" data-ov="1"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgT" tabindex="-1">
    <button class="x" data-fn="close" aria-label="Close">✕</button>
    <div class="dh"><h2 id="dlgT">${title}</h2></div>
    <div class="db">${body}</div>
    <div class="df">${btns}</div></div></div>`;
  if(opts.noAnim) m.querySelector('.dlg').style.animation = 'none';
  document.body.classList.add('locked');
  m.querySelector('.dlg').focus({preventScroll:true});
}
const msg = (title, html) => show(title, `<p>${html}</p>`);
function close(){
  $('modal').innerHTML = '';
  document.body.classList.remove('locked');
  if(lastFocus && document.contains(lastFocus)) lastFocus.focus({preventScroll:true});
  lastFocus = null;
}

/* ---------- rendering ---------- */
function render(){
  const st = $('stage');
  let h = `<img src="assets/room${S.room}.png" width="1024" height="1536" alt="${esc(ROOM_NAMES[S.room])}" draggable="false">`;
  if(S.room === 4){
    h += `<div class="glow"></div>`;
    h += SOCKETS.map((p, i) => {
      const c = S.glass[i];
      const lab = c ? `${POS[i]} socket: ${pieceLabel(c)}. Tap to remove.` : `${POS[i]} socket: empty`;
      return `<button class="sock ${S.selected ? 'armed' : ''}" style="left:${p.x}%;top:${p.y}%" data-sock="${i}" aria-label="${lab}">${c ? pieceSVG(c) : ''}</button>`;
    }).join('');
  }
  h += HOTSPOTS[S.room].map(o => `<button class="hs ${o.compact ? 'compact' : ''}" style="left:${o.x}%;top:${o.y}%" data-hs="${o.id}" aria-label="Inspect ${esc(o.name)}" title="${esc(o.name)}"><span class="lens">${MAG}</span></button>`).join('');
  st.innerHTML = h;
  st.classList.toggle('won', S.room === 4 && S.finished);
  $('roomlabel').textContent = `Room ${S.room} of 4: ${ROOM_NAMES[S.room]}`;
  const n = satchelList().length;
  $('badge').textContent = n ? n : '';
  $('satchelBtn').setAttribute('aria-label', `Open inventory, ${n} item${n === 1 ? '' : 's'}`);
  renderPlacing();
  save();
}
function renderPlacing(){
  const p = $('placing');
  if(S.room === 4 && S.selected){
    p.hidden = false;
    p.innerHTML = `${pieceSVG(S.selected)}<p>Tap a circle above the doors to set the <b>${pieceLabel(S.selected)}</b>.</p><button class="b" data-fn="unselect">Cancel</button>`;
  } else { p.hidden = true; p.innerHTML = ''; }
}

/* ---------- satchel / inventory ---------- */
const unplaced = () => S.found.filter(c => !S.glass.includes(c));
function satchelList(){ return [...S.items.map(i => ({kind:'item', id:i})), ...unplaced().map(c => ({kind:'glass', id:c}))]; }
function openSatchel(){
  const m = $('modal');
  if(!m.firstChild) lastFocus = document.activeElement;
  const list = satchelList();
  const placed = S.glass.filter(Boolean).length;
  let body = list.length ? `<div class="inv">${list.map(e => e.kind === 'item'
      ? `<button class="it" data-fn="item:${e.id}"><span class="ic" aria-hidden="true">${ITEMS[e.id].icon}</span><span>${esc(ITEMS[e.id].name)}</span></button>`
      : `<button class="it ${S.selected === e.id ? 'sel' : ''}" data-fn="pick:${e.id}" aria-label="Select ${pieceLabel(e.id)} stained glass to place">${pieceSVG(e.id)}<span>${pieceLabel(e.id)} glass</span></button>`).join('')}</div>`
    : `<p class="muted">Nothing collected yet. Tap the magnifying glasses to search the room.</p>`;
  if(S.room === 4 && unplaced().length) body += `<p class="muted small">Tap a stained-glass piece, then tap a circle above the doors to set it.</p>`;
  if(S.room === 4 && placed) body += `<p class="muted small">${placed} piece${placed === 1 ? ' is' : 's are'} set in the cross. Tap a filled circle to take it back.</p>`;
  m.innerHTML = `<div class="ov sheetwrap" data-ov="1"><div class="sheet dlg-sheet" role="dialog" aria-modal="true" aria-labelledby="satT" tabindex="-1">
    <button class="x" data-fn="close" aria-label="Close inventory">✕</button>
    <div class="dh"><h2 id="satT">Satchel</h2></div><div class="db">${body}</div></div></div>`;
  document.body.classList.add('locked');
  m.querySelector('.sheet').focus({preventScroll:true});
}
function showItem(id){
  const it = ITEMS[id]; if(!it || !has(id)) return openSatchel();

function placeAt(i){

    return displaced && displaced !== c ? `${pieceLabel(c)} set in the ${POS[i].toLowerCase()} socket. ${pieceLabel(displaced)} returned to your satchel.` : `${pieceLabel(c)} set in the ${POS[i].toLowerCase()} socket.`;
  }
  if(S.glass[i]){ const c = S.glass[i]; S.glass[i] = null; return `${pieceLabel(c)} returned to your satchel.`; }
  return null;
}
function socketTap(i){
  if(S.finished) return victory();
  const r = placeAt(i);
  if(r){ render(); toast(r); return; }
  if(S.found.length) return msg('An Empty Socket', 'An empty circular socket. Open your satchel, choose a stained-glass piece, then tap the socket to set it in place.');
  return msg('An Empty Socket', 'An empty circular socket of old lead and stone. Something is meant to sit here.');
}
function pullLever(){
  if(S.finished) return victory();
  if(S.found.length !== 4) return msg('Mechanical Lever', 'The lever will not move. You must collect all four stained-glass pieces first.');
  if(S.glass.some(x => !x)) return msg('Mechanical Lever', 'The lever will not move until all four witnesses are in their sockets.');
  if(S.glass.join('|') === 'Gold|Red|Green|Blue'){
    S.finished = true; S.selected = null; close(); render(); window.scrollTo({top:0, behavior:'smooth'});
    setTimeout(victory, 1200); return;
  }
  close();
  const st = $('stage'); st.classList.remove('flash'); void st.offsetWidth; st.classList.add('flash');
  setTimeout(() => st.classList.remove('flash'), 1600);
  window.scrollTo({top:0, behavior:'smooth'});
  setTimeout(() => msg('The Bell Tolls', 'The glass flashes and the doors stay sealed. The bell tolls. Revisit your collected clues.'), 900);
}
function victory(){
  show('YOU ESCAPED THE SANCTUARY!', `<div class="win"><p>Against all odds, terrible medicine and one extremely judgmental pink cat, you survived.</p><p class="muted">Your escape code</p><div class="esc" id="esccode">${ESCAPE_CODE}</div><p><b>DM THE EVIL OVERLORD</b> your escape code to claim your victory. 😈</p><p class="small muted">First correct DM wins, subject to the competition rules.</p></div>`,
    [B('Copy escape code', 'copycode', {pri:true}), CLOSE()]);
}
function copyCode(){
  const ok = () => toast('Escape code copied. DM the Evil Overlord!');
  const fallback = () => {
    try{
      const t = document.createElement('textarea'); t.value = ESCAPE_CODE; t.setAttribute('readonly', ''); t.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(t); t.select(); t.setSelectionRange(0, 99); const r = document.execCommand('copy'); t.remove();
      if(r) return ok();
    }catch(e){}
    const el = $('esccode');
    if(el){ const rg = document.createRange(); rg.selectNodeContents(el); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(rg); }
    toast('Copy failed. Press and hold the code to copy it.');
  };
  if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(ESCAPE_CODE).then(ok, fallback); else fallback();
}

/* ---------- action router ---------- */
function act(fn){
  const [cmd, arg] = fn.includes(':') ? [fn.slice(0, fn.indexOf(':')), fn.slice(fn.indexOf(':') + 1)] : [fn, ''];
  switch(cmd){
  case 'close': return close();
  case 'satchel': return openSatchel();
  case 'item': return showItem(arg);
  case 'next': if(+arg === S.room + 1 && ((S.room === 2 && flag('brewed')) || (S.room === 3 && flag('gate')))) return advance(+arg); return close();
  /* room 1 */
  case 'chestcheck': return chestCheck();
  case 'unlockdoor': if(S.room === 1 && has('apokey')){ take('apokey'); setFlag('door1'); return advance(2); } return close();
  /* room 2 */
  case 'ingredient': if(ING.includes(arg) && !S.brew.includes(arg) && S.brew.length < 3){ S.brew.push(arg); save(); } return brewUI('', true);
  case 'brewremove': S.brew.splice(+arg, 1); save(); return brewUI('', true);
  case 'brewreset': S.brew = []; save(); return brewUI('', true);
  case 'brewcheck': return brewCheck();
  /* room 3 */
  case 'treat':
    if(has('antidote') && !flag('guard')){
      take('antidote'); setFlag('guard'); render();
      return msg('The Guard Revives', 'You administer the antidote. The guard blinks awake: <i>“The watchman’s seal is locked in my desk. I hid the key where the beast sleeps. The watch orders changed after the outbreak!”</i>');
    } return close();
  case 'opendesk':
    if(has('ironkey') && !flag('desk')){ take('ironkey'); give('seal'); give('orders'); setFlag('desk'); render(); return deskContents(true); }
    return close();
  case 'symbol': if(SYMS.includes(arg) && !S.gate.includes(arg) && S.gate.length < 4){ S.gate.push(arg); save(); } return gateUI('', true);
  case 'gateremove': S.gate.splice(+arg, 1); save(); return gateUI('', true);
  case 'gatereset': S.gate = []; save(); return gateUI('', true);
  case 'gatecheck': return gateCheck();
  /* room 4 */
  case 'getred': return findPiece('Red', 'Hidden in the Quarantine Notice', '<p>Behind the wax seal lies the crimson plague-doctor mask.</p>');
  case 'opencabinet': setFlag('cabinet'); save(); return room4('cabinet');
  case 'color':
    if(!S.found.includes(arg)) return glassUI('Find that piece first.', true);
    S.selected = S.selected === arg ? null : arg; save(); renderPlacing(); render(); return glassUI('', true);
  case 'place': placeAt(+arg); render(); return glassUI('', true);
  case 'glassreset': S.glass = [null,null,null,null]; S.selected = null; render(); return glassUI('', true);
  case 'lever': return pullLever();
  case 'pick':
    if(S.room !== 4 || !S.found.includes(arg)) return;
    S.selected = arg; close(); render(); window.scrollTo({top:0, behavior:'smooth'});
    return toast(`Tap a circle above the doors to set the ${pieceLabel(arg)}.`);
  case 'unselect': S.selected = null; render(); return;
  case 'copycode': return copyCode();
  /* restart */
  case 'restart': return show('Restart the Challenge?', '<p>This will erase your saved progress on this device.</p>', [B('Yes, start over', 'confirmrestart', {pri:true}), B('Cancel', 'close', {light:true})]);
  case 'confirmrestart':
    S = fresh(); close(); render(); window.scrollTo(0, 0);
    return msg('A New Victim', 'You wake in the infirmary. The plague bells are ringing. Again.');
  case 'begin': setFlag('intro'); save(); return close();
  }
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-fn],[data-hs],[data-sock]');
  if(!t){
    if(e.target.dataset && e.target.dataset.ov) close();   // tap on dimmed backdrop
    return;
  }
  if(t.disabled) return;
  if(t.dataset.hs) return inspect(t.dataset.hs);
  if(t.dataset.sock !== undefined) return socketTap(+t.dataset.sock);
  act(t.dataset.fn);
});
document.addEventListener('keydown', e => { if(e.key === 'Escape' && $('modal').firstChild) close(); });
$('satchelBtn').addEventListener('click', e => { e.stopPropagation(); openSatchel(); });
$('restartBtn').addEventListener('click', e => { e.stopPropagation(); act('restart'); });

/* preload artwork */
[1,2,3,4].forEach(n => { const i = new Image(); i.src = `assets/room${n}.png`; });

render();
if(S.finished && S.room === 4) victory();
else if(!flag('intro') && S.room === 1){ setFlag('intro'); save();
  show('Escape the Sanctuary', '<p><i>Plague Protocol: a Gremlins challenge.</i></p><p>The plague bells are ringing and the sanctuary is sealed. Four rooms stand between you and freedom.</p><p>Tap the small magnifying glasses to investigate. Anything you find goes in your satchel.</p><div class="quote">Find who swallowed the false cure. Unlock the medicine chest.</div>', [B('Begin', 'begin', {pri:true})]); }
</script>
</body>
</html>
