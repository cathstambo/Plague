<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15100f"><title>Escape the Sanctuary — Plague Protocol</title><style>
:root{color-scheme:dark;--bg:#15100f;--panel:#261d19;--line:#765b43;--gold:#e6bb77;--text:#f3e6d4;--muted:#bda994}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#35251d,var(--bg) 72%);font:16px/1.45 Georgia,serif;color:var(--text)}button{font:inherit;cursor:pointer}header{padding:12px max(14px,env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #644830}header strong{color:var(--gold);font-size:clamp(16px,3vw,23px)}header small{display:block;color:var(--muted)}.wrap{max-width:1100px;margin:auto;padding:12px}.scene{position:relative;aspect-ratio:3/2;border:3px solid #8b6a44;border-radius:10px;overflow:hidden;background:#080808;box-shadow:0 14px 35px #0008}.scene img{width:100%;height:100%;display:block}.hot{position:absolute;border:1px solid transparent;background:transparent;border-radius:8px;touch-action:manipulation}.hot:focus-visible{outline:3px solid #ffdb8c;background:#ffce4d33}.hot:hover{background:#ffce4d1c;border-color:#ffdca67a}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.btn{background:linear-gradient(#6c4b2d,#422b1d);border:1px solid #ad8353;color:#fff0d6;border-radius:8px;padding:11px 14px;min-height:44px}.btn:disabled{opacity:.35;cursor:not-allowed}.btn.active{background:#89642d;border-color:#f9d37e}.btn.ghost{background:#29201c}.panel{background:#261d19;border:1px solid #6f533a;border-radius:10px;padding:13px;margin-top:10px}.panel h3{color:var(--gold);margin:0 0 8px}.muted{color:var(--muted)}.small{font-size:13px}.items{display:flex;flex-wrap:wrap;gap:7px}.pill{padding:6px 10px;border:1px solid #846543;border-radius:20px;background:#39291d}.overlay{position:fixed;inset:0;background:#000b;z-index:10;display:flex;align-items:center;justify-content:center;padding:12px}.dialog{width:min(570px,100%);max-height:90dvh;overflow:auto;background:#251c18;border:2px solid #ad8353;border-radius:14px;padding:18px;box-shadow:0 15px 60px #000}.dialog h2{margin:0 0 10px;color:#f0c782;font-size:24px}.dialog p{margin:9px 0}.dialog footer{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.dialog table{border-collapse:collapse;width:100%;font-size:14px}.dialog td,.dialog th{padding:7px 5px;text-align:left;border-bottom:1px solid #604735}.choice{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.choice button{flex:1 1 110px}.slots{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.slot{border:1px dashed #c99c66;padding:12px;min-width:80px;flex:1;text-align:center;border-radius:6px}.notice{padding:10px;border-left:3px solid var(--gold);background:#443024;margin:10px 0}.win{text-align:center;padding:20px 4px}.win h2{font-size:30px}.code{font:700 clamp(20px,5vw,30px) Georgia;color:#f8d38b;letter-spacing:2px;padding:12px;border:1px dashed #c69a56}.mapnote{font-size:13px;text-align:center;color:#c6ad8f;margin-top:6px}@media(max-width:600px){.wrap{padding:7px}.scene{border-width:2px}.dialog{padding:14px}.dialog h2{font-size:21px}.btn{padding:10px}.toolbar{gap:6px}}

/* Portrait-first, proportional artwork and touch exploration */
html,body{height:100%;height:100dvh;overflow:hidden}
body{display:flex;flex-direction:column}
header{flex:0 0 auto;padding:8px 12px;min-height:48px}
header small{display:none}
header strong{font-size:clamp(15px,4vw,21px)}
.wrap{flex:1;min-height:0;width:100%;max-width:750px;margin:0 auto;padding:5px 7px 8px;display:flex;flex-direction:column}
.scene{flex:1;min-height:0;width:100%;aspect-ratio:auto;touch-action:none;border-radius:8px;overflow:hidden;position:relative;cursor:grab;background:#0b0908}
.scene:active{cursor:grabbing}
.stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.stage img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none}
.stage .hot{z-index:2;touch-action:none}
.stage .hot:hover{background:#ffce4d12}
.mapnote,.toolbar,.wrap>.panel{display:none!important}
.hud{display:flex;align-items:center;gap:7px;justify-content:space-between;min-height:46px;padding:4px 1px;color:var(--gold);font-size:12px}
.hud .btn{padding:7px 9px;min-height:38px;font-size:12px}
.hud .hint{display:none}
.overlay{z-index:30}.dialog{width:min(610px,95vw);max-height:87dvh}
.inventory-grid{display:flex;flex-wrap:wrap;gap:8px}
.invpiece{border:1px solid #9a784c;border-radius:8px;background:#39271d;color:#ffe2b2;padding:9px;min-height:48px}
.invpiece.selected{outline:2px solid #f6d184}
.cross{display:grid;grid-template-columns:repeat(3,minmax(70px,100px));grid-template-rows:repeat(3,72px);justify-content:center;gap:5px;margin:14px auto}
.cross .socket{border:2px solid #a78356;border-radius:10px;background:#1b1513;color:#eed8bd;font-size:13px;min-width:0;padding:3px}
.cross .socket:nth-child(1){grid-column:2;grid-row:1}.cross .socket:nth-child(2){grid-column:3;grid-row:2}.cross .socket:nth-child(3){grid-column:2;grid-row:3}.cross .socket:nth-child(4){grid-column:1;grid-row:2}
.cross .socket.filled{background:var(--piece);color:white;text-shadow:0 1px 3px black}
@media(max-width:390px){header{padding:6px 8px}.hud{font-size:11px}.hud .btn{padding:6px 7px}}
@media(max-height:480px){.dialog{padding:10px;font-size:14px}.dialog h2{font-size:19px}}
</style></head><body><header><div><strong>☠ ESCAPE THE SANCTUARY</strong><small>Plague Protocol · A Gremlins challenge</small></div><button class="btn ghost" id="restart">Restart</button></header><main class="wrap"><div class="scene" id="scene"></div><div class="hud"><span id="roomlabel">Room 1</span><span class="hint">Tap · Pinch · Drag</span><button class="btn ghost" id="bag">🎒 Inventory</button><button class="btn ghost" id="fit">Fit</button></div><div class="mapnote">Tap the labelled objects in the scene to investigate. You can also use the object list below.</div><div class="toolbar" id="actions"></div><section class="panel"><h3>🎒 Inventory</h3><div class="items" id="inventory"></div></section><section class="panel"><h3>📜 Journal</h3><div class="items" id="journal"></div></section><div class="panel small muted" id="status"></div></main><div id="modal"></div><script>
'use strict';const KEY='gremlins-plague-protocol-final-v1';const initial=()=>({room:1,items:[],notes:[],flags:{},brew:[],gate:[],glass:[null,null,null,null],selected:null,finished:false,foundGlass:[]});let S;try{S={...initial(),...JSON.parse(localStorage.getItem(KEY)||'null')}}catch{S=initial()}if(!S||!S.flags)S=initial();const save=()=>localStorage.setItem(KEY,JSON.stringify(S));const has=x=>S.items.includes(x);const add=x=>{if(!has(x))S.items.push(x);save()};const flag=x=>!!S.flags[x];const setflag=x=>{S.flags[x]=true;save()};const note=(title,body)=>{if(!S.notes.some(n=>n.title===title))S.notes.push({title,body});save()};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const btn=(text,fn,disabled=false)=>`<button class="btn" ${disabled?'disabled':''} data-fn="${fn}">${esc(text)}</button>`;const close=()=>{document.getElementById('modal').innerHTML=''};const show=(title,body,buttons='')=>{document.getElementById('modal').innerHTML=`<div class="overlay"><div class="dialog" role="dialog" aria-modal="true"><h2>${title}</h2>${body}<footer>${buttons||btn('Close','close')}</footer></div></div>`};const msg=(title,body)=>show(title,`<p>${body}</p>`);const table=(heads,rows)=>`<table><tr>${heads.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table>`;
const objects={1:[['Patient Records',17,78,22,16,'ledger'],['Patients',6,36,52,34,'patients'],['Medicine Chest',70,65,29,29,'chest'],['Door to Apothecary',79,27,21,40,'door'],['Tapestry',2,2,32,32,'tapestry'],['Bloodstained Cloth',43,79,24,18,'cloth'],['Treatment Guide',1,74,22,18,'guide'],['Bed Markings',25,43,39,35,'marks']],2:[['Ingredient Shelves',17,7,67,45,'jars'],['Experiment Journal',3,72,32,24,'experiments'],['Recipe Book',61,70,35,27,'recipes'],['Cauldron',31,44,45,36,'cauldron'],['Brewing Inscription',40,55,25,15,'breworder'],['Suspicious Phial',2,52,20,22,'phial']],3:[['Sick Guard',2,41,33,31,'guard'],['Guard’s Desk',3,69,62,29,'desk'],['Pink Cat',65,62,35,29,'cat'],['Supply Crates',63,42,36,19,'crates'],['Gate Mechanism',27,4,70,43,'gate'],['Old Watch Ledger',29,79,28,15,'oldwatch'],['Rusty Key',1,72,17,18,'rusty']],4:[['Empty Cross Sockets',27,3,50,34,'window'],['Quarantine Notice',0,29,24,24,'notice'],['Reliquary',0,49,34,26,'reliquary'],['Loose Floor Tile',36,84,36,16,'tile'],['Locked Cabinet',78,38,22,27,'cabinet'],['Mechanical Lever',79,58,21,26,'lever'],['Exit Doors',29,35,48,43,'exitdoor']] };const descriptions={1:'Find who swallowed the false cure. Unlock the medicine chest.',2:'Investigate the experiments. Brew the only effective antidote.',3:'Revive the guard, repair the gate, and restore the watch.',4:'Restore the four witnesses around the cross. Break the last seal.'};let camera={scale:1,x:0,y:0,base:1},gestures=new Map(),gestureStart=null,ignoreClickUntil=0;
function resetCamera(){const scene=document.getElementById('scene'),w=scene.clientWidth,h=scene.clientHeight,imW=1024,imH=1536;camera.base=Math.min(w/imW,h/imH);camera.scale=1;camera.x=(w-imW*camera.base)/2;camera.y=(h-imH*camera.base)/2;applyCamera()}
function applyCamera(){const stage=document.querySelector('.stage');if(stage)stage.style.transform=`translate(${camera.x}px,${camera.y}px) scale(${camera.base*camera.scale})`}
function clampCamera(){const el=document.getElementById('scene'),w=1024*camera.base*camera.scale,h=1536*camera.base*camera.scale;camera.x=w<=el.clientWidth?(el.clientWidth-w)/2:Math.min(0,Math.max(el.clientWidth-w,camera.x));camera.y=h<=el.clientHeight?(el.clientHeight-h)/2:Math.min(0,Math.max(el.clientHeight-h,camera.y));applyCamera()}
function zoomAt(factor,cx,cy){const prev=camera.base*camera.scale;const next=Math.max(1,Math.min(5,camera.scale*factor));const ratio=next/camera.scale;camera.x=cx-(cx-camera.x)*ratio;camera.y=cy-(cy-camera.y)*ratio;camera.scale=next;clampCamera()}
function focusObject(id){const o=objects[S.room].find(o=>o[5]===id);if(!o)return;const el=document.getElementById('scene'),r=el.getBoundingClientRect();const cx=(o[1]+o[3]/2)/100*1024,cy=(o[2]+o[4]/2)/100*1536;camera.scale=Math.max(camera.scale,Math.min(3.1,Math.max(1.65,el.clientHeight/(o[4]/100*1536*camera.base)*.58)));camera.x=el.clientWidth/2-cx*camera.base*camera.scale;camera.y=el.clientHeight/2-cy*camera.base*camera.scale;clampCamera()}
function render(){document.getElementById('scene').innerHTML=`<div class="stage" style="width:1024px;height:1536px"><img draggable="false" alt="Room ${S.room}" src="assets/room${S.room}.webp">`+objects[S.room].map(([name,x,y,w,h,id])=>`<button class="hot" aria-label="Inspect ${esc(name)}" title="${esc(name)}" style="left:${x}%;top:${y}%;width:${w}%;height:${h}%" data-obj="${id}"></button>`).join('')+'</div>';document.getElementById('roomlabel').textContent=`Room ${S.room} / 4 — ${['','The Infirmary','The Apothecary','The Main Sanctuary Hall','The Final Escape'][S.room]}`;document.getElementById('actions').innerHTML='';document.getElementById('inventory').innerHTML='';document.getElementById('journal').innerHTML='';document.getElementById('status').textContent='';save();requestAnimationFrame(resetCamera)}

function advance(n){S.room=n;S.brew=[];S.gate=[];close();render();window.scrollTo(0,0);msg(['','Infirmary','The Apothecary','The Main Sanctuary Hall','The Sanctuary Entrance'][n],descriptions[n])}
const mappings={Crow:4,Moon:8,Sun:1,Serpent:6,Gravebloom:7,Frostmoss:2,Emberroot:5,Silverleaf:9};
function inspect(id){switch(S.room){case 1:return room1(id);case 2:return room2(id);case 3:return room3(id);case 4:return room4(id)}}
function room1(id){switch(id){case'ledger':note('Patient ledger','Aldric — blackened fingers — Silverleaf — Moon bed. Branna — burning fever — Emberroot — Sun bed. Corvin — violent coughing — Gravebloom — Crow bed. Daria — shivering — Frostmoss — Serpent bed.');return show('Healer’s Ledger',table(['Patient','Symptoms','Given','Bed'],[['Aldric','Blackened fingers','Silverleaf','Moon'],['Branna','Burning fever','Emberroot','Sun'],['Corvin','Violent coughing','Gravebloom','Crow'],['Daria','Shivering','Frostmoss','Serpent']])) ;case'guide':note('Treatment guide','Blackened fingers → Silverleaf; burning fever → Emberroot; shivering → Gravebloom; violent coughing → Frostmoss.');return show('Treatment Guide',table(['Symptom','Correct treatment'],[['Blackened fingers','Silverleaf'],['Burning fever','Emberroot'],['Shivering','Gravebloom'],['Violent coughing','Frostmoss']]));case'patients':note('Bedside evidence','Corvin: empty cup stained with Gravebloom. Daria: sealed, unopened Frostmoss packet. Night healer: “Only one patient swallowed the wrong medicine. The other never received their dose.”');return show('The Patients','<p>Corvin’s bedside cup is empty, with dark Gravebloom residue at its base.</p><p>Beside Daria lies an <b>unopened</b>, sealed Frostmoss packet.</p><p>A night healer’s note reads: <i>“Only one patient swallowed the wrong medicine. The other never received their dose.”</i></p>');case'marks':note('Number carvings','Bed marks: Crow 4, Moon 8, Sun 1, Serpent 6. Remedies: Gravebloom 7, Frostmoss 2, Emberroot 5, Silverleaf 9.');return show('Carvings in the Beams',table(['Mark','Number'],Object.entries(mappings)));case'chest':return show('Locked Medicine Chest','<p>Engraved on the lock:</p><div class="notice">For the patient who <b>swallowed</b> the false cure: first the mark upon their bed; second the medicine they were given; third the medicine that should have saved them.</div><p>Enter the three digits:</p><input id="code" inputmode="numeric" maxlength="3" pattern="[0-9]*" placeholder="000" style="width:100%;padding:13px;font-size:22px;background:#120f0e;color:white;border:1px solid #9b774c;border-radius:6px">',btn('Unlock chest','chestcheck')+btn('Close','close'));case'door':if(!has('Apothecary key'))return msg('Locked Door','A heavy iron lock bars the apothecary. Somewhere in this room there must be a key.');return advance(2);case'tapestry':return msg('Suspicious Tapestry','A faded tapestry depicts a plague doctor riding a goose. Behind it? Stone. Just stone.');case'cloth':return msg('Bloodstained Cloth','A gruesome rag. It smells of old iron and questionable laundry habits. Nothing is concealed beneath it.')}}
function room2(id){switch(id){case'jars':return show('Six Ingredient Jars',table(['Ingredient','Appearance'],[['Silverleaf','Pale leaves with metallic veins'],['Gravebloom','Purple flowers smelling of damp earth'],['Emberroot','Twisted red roots, warm to the touch'],['Frostmoss','Blue-grey moss, unnaturally cold'],['Nightshade','Black berries in dark liquid'],['Moonwater','Clear liquid with a silvery shimmer']]));case'experiments':{const b='Each ingredient has one primary effect; no two share an effect. Each successful property in a mixture comes from at least one of its ingredients. Effects do not cancel.';note('Experiment journal',b+' Trials: I Silverleaf+Gravebloom: blood yes, spread no, stable no. II Gravebloom+Emberroot: no/no/no. III Emberroot+Frostmoss: no/yes/no. IV Frostmoss+Nightshade: no/yes/no. V Nightshade+Moonwater: no/no/yes. VI Moonwater+Silverleaf: yes/no/yes.');return show('The Experiment Journal',`<p>${b}</p>`+table(['Trial','Ingredients','Blood','Spread','Stable'],[['I','Silverleaf + Gravebloom','✓','–','–'],['II','Gravebloom + Emberroot','–','–','–'],['III','Emberroot + Frostmoss','–','✓','–'],['IV','Frostmoss + Nightshade','–','✓','–'],['V','Nightshade + Moonwater','–','–','✓'],['VI','Moonwater + Silverleaf','✓','–','✓']]));}case'recipes':note('Old recipes','Healer’s Mercy: Silverleaf, Gravebloom, Moonwater. Crimson Remedy: Emberroot, Frostmoss, Moonwater. Silent Cure: Silverleaf, Frostmoss, Nightshade. The Silent Cure made patients look well, but the illness returned.');return show('The Old Recipe Book',table(['Recipe','Ingredients'],[['Healer’s Mercy','Silverleaf, Gravebloom, Moonwater'],['Crimson Remedy','Emberroot, Frostmoss, Moonwater'],['Silent Cure','Silverleaf, Frostmoss, Nightshade']])+'<p><i>“The Silent Cure fooled us. Their skin cleared, yet the sickness returned before dawn.”</i></p>');case'breworder':note('Brewing order','The new plague darkens the blood, spreads beneath the skin, and spoils medicine. Cauldron: first cleanse corruption, next halt the spread, last preserve the mixture.');return msg('Cauldron Inscription','The new plague blackens the blood, spreads beneath the skin, and spoils the remedy.<div class="notice">First, cleanse what has been corrupted.<br>Next, halt what seeks to spread.<br>Last, preserve what would otherwise perish.</div>');case'phial':return msg('The Green Phial','“ORIGINAL PLAGUE CURE” reads the label. Below, in smaller handwriting: “Results pending.” The liquid has eaten through the cork. Probably best not.');case'cauldron':return brewUI()}}
const ing=['Silverleaf','Gravebloom','Emberroot','Frostmoss','Nightshade','Moonwater'];function brewUI(message=''){show('The Brewing Cauldron','<p>Select three different ingredients <b>in order</b>.</p><div class="slots">'+[0,1,2].map(i=>`<div class="slot">${i+1}. ${esc(S.brew[i]||'Empty')}</div>`).join('')+'</div><div class="choice">'+ing.map(x=>btn(x,'ingredient:'+x,S.brew.includes(x)||S.brew.length>=3)).join('')+'</div>'+(message?`<div class="notice">${message}</div>`:''),btn('Brew','brewcheck',S.brew.length!==3)+btn('Empty cauldron','brewreset')+btn('Close','close'))}
function room3(id){switch(id){case'guard':if(flag('guard'))return msg('The Watchman','“I told you, the key is under the beast’s blankets. And don’t follow the old watch orders!”');if(!has('Antidote'))return msg('Sick Guard','The guard coughs weakly. He needs medicine — something stronger than the old cures.');setflag('guard');return msg('The Guard Revives','You administer the antidote. The guard blinks awake: <i>“The watchman’s seal is locked in my desk. I hid the key where the beast sleeps. The watch orders changed after the outbreak!”</i>');case'cat':if(!flag('guard'))return msg('The Pink Menace','The pink cat hisses and buries itself deeper into its blankets. Perhaps someone knows what it is guarding.');if(has('Iron key'))return msg('Pink Cat','The cat looks offended that you stole its shiny treasure.');add('Iron key');render();return msg('Under the Blankets','The cat swipes at your fingers, but you retrieve a <b>small iron key</b>. It is now in your inventory.');case'desk':if(!has('Iron key'))return msg('Locked Desk','The guard’s drawer is locked. A narrow iron keyhole is visible.');if(!flag('desk')){setflag('desk');add('Watchman’s seal');note('Revised watch orders','The Crow stands immediately before the Moon. The Moon takes the final watch. The old ledger is obsolete.');note('Seal engraving','The Serpent stands immediately before the Sun.');render()}return show('Guard’s Desk — Unlocked','<p>Inside you find the <b>watchman’s seal</b> and revised orders:</p><div class="notice">The Crow stands immediately before the Moon. The Moon takes the final watch.</div><p>On the reverse of the seal:</p><div class="notice">The Serpent stands immediately before the Sun.</div><p>A second, tiny engraving reads: <i>“The golden witness keeps vigil above all others.”</i></p>');case'oldwatch':note('Old watch ledger','Before the plague: Sun first, Serpent last, Crow before Moon. Clearly marked OBSOLETE.');return msg('Old Guard Ledger','<i>“Before the plague, the Sun began the watch, and the Serpent ended it. The Crow stood before the Moon.”</i><p>A red wax stamp reads <b>OBSOLETE — DO NOT USE</b>.</p>');case'crates':if(has('Brass cog'))return msg('Supply Crates','Only splinters and a loaf of bread with ambitions of sentience remain.');add('Brass cog');render();return msg('False Bottom','You lift a loose plank beneath the crates and find a <b>brass cog</b>. Also some mouldy bread. The bread stays.');case'rusty':return msg('Rusty Key','You try a corroded key hanging beside the hearth. It opens a tiny chest containing… another rusty key. This is going nowhere.');case'gate':if(!has('Brass cog'))return msg('Broken Gate','One brass cog is missing from the mechanism. It cannot turn.');if(!has('Watchman’s seal'))return msg('Sealed Gate','The cog fits! But the gate still requires the watchman’s seal.');return gateUI()}}
const syms=['Sun','Moon','Crow','Serpent'];function gateUI(message=''){show('The Watchman’s Gate','<p>Fit the cog, arrange the four watches from first to last, and turn the seal.</p><div class="slots">'+[0,1,2,3].map(i=>`<div class="slot">${i+1}. ${S.gate[i]||'—'}</div>`).join('')+'</div><div class="choice">'+syms.map(x=>btn(x,'symbol:'+x,S.gate.includes(x)||S.gate.length>=4)).join('')+'</div>'+(message?`<div class="notice">${message}</div>`:''),btn('Turn seal','gatecheck',S.gate.length!==4)+btn('Reset symbols','gatereset')+btn('Close','close'))}
const glassColors=['Gold','Red','Green','Blue'],glassHex={Gold:'#b28a35',Red:'#9f313b',Green:'#2d7750',Blue:'#315f9d'},glassNames={Gold:'Unicorn',Red:'Plague Doctor',Green:'Gremlin',Blue:'Taco'};
function findPiece(color,heading,description){if(!S.foundGlass)S.foundGlass=[];if(!S.foundGlass.includes(color)){S.foundGlass.push(color);add(color+' '+glassNames[color]+' glass');render()}return msg(heading,description+'<p><b>'+color+' '+glassNames[color]+' stained-glass piece '+(S.foundGlass.filter(c=>c===color).length?'secured':'found')+'.</b></p>')}
function room4(id){switch(id){case'notice':note('Quarantine order','The crimson witness faces the azure witness across the cross.');return show('Quarantine Notice','<p>The crimson witness must face the azure witness across the cross. Red and Blue belong opposite each other.</p>'+btn('Lift the loose seal','getred'));case'reliquary':return findPiece('Gold','The Reliquary','Inside an ornate reliquary rests a golden unicorn silhouette. An inscription says: “Gold watches from the highest place.”');case'tile':return findPiece('Green','Loose Floor Tile','Beneath a loose stone, a green gremlin silhouette. Scratched underneath: “The emerald follows immediately clockwise after crimson.”');case'cabinet':return findPiece('Blue','The Cabinet','The old cabinet yields a blue taco-shaped stained-glass piece. The cabinet door was never properly locked. Typical.');case'window':return glassUI();case'lever':if(S.glass.join('|')==='Gold|Red|Green|Blue')return action('glasscheck');return glassUI('The lever will not move until all four witnesses are in their correct sockets.');case'exitdoor':return msg('Sealed Exit','The heavy doors will only open once the stained-glass cross is restored and the lever is pulled.')}}
function glassUI(message=''){const pieces=S.glass,found=S.foundGlass||[];const positions=['Top','Right','Bottom','Left'];const cells=positions.map((x,i)=>`<button class="socket ${pieces[i]?'filled':''}" style="${pieces[i]?'--piece:'+glassHex[pieces[i]]:''}" data-fn="place:${i}">${x}<br><b>${pieces[i]?glassNames[pieces[i]]:'Empty'}</b></button>`).join('');show('The Four Witnesses','<p>Find all four pieces in the room. Select a collected piece, then tap a socket. Tap a filled socket with nothing selected to remove it.</p><div class="inventory-grid">'+glassColors.map(c=>`<button class="invpiece ${S.selected===c?'selected':''}" data-fn="color:${c}" ${!found.includes(c)?'disabled':''} style="border-bottom:4px solid ${glassHex[c]}">${found.includes(c)?c+' '+glassNames[c]:'🔒 Unknown piece'}</button>`).join('')+'</div><div class="cross">'+cells+'</div><p class="small muted">Clockwise: Top → Right → Bottom → Left. Collected: '+found.length+'/4.</p>'+(message?`<div class="notice">${message}</div>`:''),btn('Pull the lever','glasscheck',pieces.some(x=>!x)||found.length!==4)+btn('Remove all pieces','glassreset')+btn('Close','close'))}
function action(fn){if(fn==='close'){close();return}if(fn==='getred')return findPiece('Red','Hidden in the Quarantine Notice','Behind the wax seal lies the crimson plague-doctor mask.');if(fn.startsWith('obj:'))return inspect(fn.slice(4));if(fn.startsWith('note:')){const n=S.notes[+fn.slice(5)];return show(esc(n.title),`<p>${esc(n.body)}</p>`)}if(fn==='chestcheck'){const v=document.getElementById('code')?.value;if(v==='472'){add('Apothecary key');add('Torn quarantine document');note('Quarantine fragment','“The crimson witness shall forever face the azure witness across the holy cross.” Red and Blue must be opposite.');setflag('chest');render();return msg('Chest Unlocked!','Inside: an <b>apothecary key</b> and a torn quarantine document. The document reads: <i>“The crimson witness shall forever face the azure witness across the holy cross.”</i>')}return msg('The Lock Holds','The chest refuses to open. Recheck who actually swallowed the wrong medicine, and the number carvings.')}if(fn.startsWith('ingredient:')){S.brew.push(fn.slice(11));save();return brewUI()}if(fn==='brewreset'){S.brew=[];save();return brewUI()}if(fn==='brewcheck'){if(S.brew.join('|')==='Silverleaf|Frostmoss|Moonwater'){add('Antidote');add('Sanctuary map fragment');note('Stained-glass diagram','Follow the sun’s path clockwise around the cross. The emerald witness comes directly after the crimson. Green is immediately clockwise after Red.');setflag('brewed');render();return show('The True Cure!','<p>The antidote glimmers silver. A concealed drawer clicks open.</p><p>You collect the <b>antidote</b> and a <b>stained-glass diagram</b>:</p><div class="notice">Follow the sun’s path clockwise around the cross. The emerald witness comes directly after the crimson.</div>',btn('Enter the Main Hall','next:3'))}const bad=S.brew.includes('Nightshade')?'The potion turns purple. Then your skin turns purple. Not ideal.':S.brew.includes('Emberroot')?'The cauldron erupts. Your eyebrows have escaped before you.':'The brew curdles into a foul sludge. Even Eddie would refuse to drink it.';S.brew=[];save();return brewUI(bad)}if(fn.startsWith('symbol:')){S.gate.push(fn.slice(7));save();return gateUI()}if(fn==='gatereset'){S.gate=[];save();return gateUI()}if(fn==='gatecheck'){if(S.gate.join('|')==='Serpent|Sun|Crow|Moon'){note('Golden witness','A tiny engraving on the watchman’s seal: “The golden witness keeps vigil above all others.” Gold belongs at the top of the cross.');setflag('gate');render();return show('The Gate Opens','<p>The cog catches. The seal turns. The heavy iron gate groans open.</p><p>On the reverse of the seal you notice another engraving:</p><div class="notice">The golden witness keeps vigil above all others.</div>',btn('Enter the Sanctuary Entrance','next:4'))}S.gate=[];save();return gateUI('The mechanism jams and an enormous bell rings. Somewhere, a Gremlin swears.')}if(fn.startsWith('color:')){const c=fn.slice(6);if(!(S.foundGlass||[]).includes(c))return glassUI('Find that piece first.');S.selected=S.selected===c?null:c;save();return glassUI()}if(fn.startsWith('place:')){let i=+fn.slice(6);if(S.selected){if(!(S.foundGlass||[]).includes(S.selected))return glassUI('Find that piece first.');S.glass=S.glass.map(c=>c===S.selected?null:c);S.glass[i]=S.selected;S.selected=null}else S.glass[i]=null;save();return glassUI()}if(fn==='glassreset'){S.glass=[null,null,null,null];S.selected=null;save();return glassUI()}if(fn==='glasscheck'){if((S.foundGlass||[]).length!==4)return glassUI('You must collect all four stained-glass pieces first.');if(S.glass.join('|')==='Gold|Red|Green|Blue'){S.finished=true;save();render();return show('YOU ESCAPED THE SANCTUARY!','<div class="win"><p>Against all odds, terrible medicine and one extremely judgmental pink cat, you survived.</p><p class="muted">YOUR ESCAPE CODE</p><div class="code">GREMLIN-ESCAPED</div><p><b>DM THE EVIL OVERLORD</b> your escape code to claim your victory. 😈</p><p class="small muted">First correct DM wins, subject to the competition rules.</p></div>',btn('Copy escape code','copycode')+btn('Close','close'))}return glassUI('The glass flashes and the doors stay sealed. The bell tolls. Revisit your collected clues.')}if(fn==='copycode'){navigator.clipboard?.writeText('GREMLIN-ESCAPED').then(()=>msg('Copied!','DM the Evil Overlord your escape code.')).catch(()=>msg('Your Code','GREMLIN-ESCAPED — copy this and DM the Evil Overlord.'));return}if(fn.startsWith('next:'))return advance(+fn.slice(5))}
document.addEventListener('click',e=>{const t=e.target.closest('[data-fn],[data-obj]');if(!t)return;if(t.dataset.obj){if(Date.now()<ignoreClickUntil)return;focusObject(t.dataset.obj);inspect(t.dataset.obj)}else action(t.dataset.fn)});
const scene=document.getElementById('scene');scene.addEventListener('pointerdown',e=>{if(!e.target.closest('[data-obj]'))scene.setPointerCapture(e.pointerId);gestures.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY});gestureStart=null});scene.addEventListener('pointermove',e=>{if(!gestures.has(e.pointerId))return;const old=gestures.get(e.pointerId);const dx=e.clientX-old.x,dy=e.clientY-old.y;old.x=e.clientX;old.y=e.clientY;if(Math.hypot(e.clientX-old.sx,e.clientY-old.sy)>9)ignoreClickUntil=Date.now()+400;if(gestures.size===1){camera.x+=dx;camera.y+=dy;clampCamera()}else if(gestures.size===2){const a=[...gestures.values()],dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(gestureStart){const r=scene.getBoundingClientRect();zoomAt(dist/gestureStart.dist,(a[0].x+a[1].x)/2-r.left,(a[0].y+a[1].y)/2-r.top)}gestureStart={dist};ignoreClickUntil=Date.now()+500}});for(const evt of ['pointerup','pointercancel','lostpointercapture'])scene.addEventListener(evt,e=>{gestures.delete(e.pointerId);gestureStart=null});scene.addEventListener('wheel',e=>{e.preventDefault();const r=scene.getBoundingClientRect();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX-r.left,e.clientY-r.top)},{passive:false});let lastTap=0;scene.addEventListener('pointerup',e=>{if(e.pointerType==='touch'&&Date.now()-lastTap<280){resetCamera();ignoreClickUntil=Date.now()+500}lastTap=Date.now()});window.addEventListener('resize',()=>requestAnimationFrame(resetCamera));document.getElementById('fit').onclick=resetCamera;document.getElementById('bag').onclick=()=>show('🎒 Inventory',S.items.length?'<div class="inventory-grid">'+S.items.map(x=>'<div class="invpiece">'+esc(x)+'</div>').join('')+'</div>':'<p>Nothing collected yet.</p>');document.getElementById('restart').onclick=()=>{show('Restart the Challenge?','<p>This will erase your saved progress on this device.</p>',btn('Yes, start over','confirmrestart')+btn('Cancel','close'))};const originalAction=action;action=function(fn){if(fn==='confirmrestart'){S=initial();save();close();render();return msg('A New Victim','You wake in the infirmary. The plague bells are ringing. Again.')}return originalAction(fn)};render();if(S.finished)msg('You Escaped!','Your escape code is <b>GREMLIN-ESCAPED</b>. DM the Evil Overlord!');
</script></body></html>
