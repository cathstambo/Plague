<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15100f"><title>Escape the Sanctuary — Plague Protocol</title><style>
:root{color-scheme:dark;--gold:#e7ba76;--text:#f5e8d2}*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#090807;color:var(--text);font-family:Georgia,serif}button{font:inherit;cursor:pointer}header{position:absolute;top:0;left:0;right:0;z-index:4;display:flex;align-items:center;justify-content:space-between;padding:5px 12px;background:linear-gradient(#120d0cfa,#130d0ca8);height:43px;border-bottom:1px solid #7b5735}header strong{color:var(--gold);font-size:clamp(13px,2.2vw,20px)}header small{display:none}.wrap{width:100vw;height:100dvh;padding:43px 0 0;display:flex;flex-direction:column}.room-hud{display:none}.scene-viewport{flex:1;min-height:0;overflow:hidden;background:#0b0908}.scene{height:100%;width:100%;position:relative;overflow:hidden;background:#0a0908}.scene img{width:100%;height:100%;object-fit:fill;display:block}.hot{position:absolute;display:flex;align-items:center;justify-content:center;transform:translate(-50%,-50%);width:clamp(32px,4.4vw,48px)!important;height:clamp(32px,4.4vw,48px)!important;padding:0;border:2px solid #d7a969;border-radius:50%;background:#100c0de8;color:#f8d5a0;box-shadow:0 2px 8px #000e;z-index:2;touch-action:manipulation}.hot:focus-visible{outline:3px solid white}.hot svg{width:62%;height:62%;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round}.hot:active{background:#715030}.hot::after{content:attr(aria-label);position:absolute;bottom:calc(100% + 5px);left:50%;transform:translateX(-50%);white-space:nowrap;background:#100c0df2;color:#f8d5a0;border:1px solid #d7a969;border-radius:4px;padding:3px 7px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .12s}.hot:hover::after,.hot:focus-visible::after{opacity:1}.btn{background:#39291f;border:1px solid #b68b54;border-radius:8px;color:#f6e4c5;padding:8px 12px;min-height:34px}.btn:disabled{opacity:.4}.btn.active{background:#88602b}.toolbar,#status,#actions{display:none!important}#bagpanel{display:none;position:fixed;z-index:7;right:8px;top:48px;max-width:min(340px,90vw);background:#231a16;border:2px solid #ad8353;border-radius:10px;padding:12px;box-shadow:0 12px 35px #000c}#bagpanel.open{display:block}#bagpanel h3{margin:0 0 8px;color:var(--gold)}.items{display:flex;gap:6px;flex-wrap:wrap}.pill{padding:5px 8px;border:1px solid #8d6a48;border-radius:20px}.muted,.small{color:#c9b8a0}.overlay{position:fixed;inset:0;z-index:20;background:#000c;display:flex;align-items:center;justify-content:center;padding:10px}.dialog{background:#251b16;border:2px solid #c2965c;border-radius:13px;padding:16px;width:min(620px,96vw);max-height:94dvh;overflow:auto;box-shadow:0 15px 55px #000}.dialog h2{color:var(--gold);font-size:clamp(19px,3vw,25px);margin:0 0 8px}.dialog p{margin:8px 0}.dialog footer{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.dialog table{border-collapse:collapse;width:100%;font-size:clamp(12px,2vw,15px)}.dialog th,.dialog td{padding:5px;border-bottom:1px solid #6c4e35;text-align:left}.notice{border-left:3px solid #e5b87a;background:#453023;padding:9px;margin:8px 0}.choice,.slots{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.choice button{flex:1 1 100px}.slot{border:1px dashed #cda36c;border-radius:6px;padding:9px;flex:1;text-align:center;min-width:80px}.win{text-align:center}.code{font-size:24px;color:#f7d391;letter-spacing:1px;border:1px dashed #c9a66d;padding:10px}.rotate{display:none}#bagbtn{position:absolute;top:4px;right:105px;z-index:5;font-size:14px}#restart{font-size:14px}.scene-caption{position:absolute;top:48px;left:12px;z-index:5;pointer-events:none;color:#e8b978;font-size:clamp(13px,2vw,19px);font-weight:bold;text-shadow:0 2px 5px #000,0 0 7px #000}#bagpanel .muted{font-size:14px}@media (orientation:portrait) and (max-width:800px){.rotate{display:flex;position:fixed;inset:0;z-index:30;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:#110d0b;color:#eac18a;padding:30px;font-size:22px}.rotate small{font-size:15px;margin-top:15px;color:#d1b99b}}@media (orientation:landscape) and (max-height:520px){header{height:36px}.wrap{padding-top:36px}.dialog{max-height:96dvh}.dialog h2{font-size:19px}.dialog p{font-size:14px}#bagbtn{top:2px}.scene-caption{top:41px}}
</style></head><body><header><div><strong>☠ ESCAPE THE SANCTUARY</strong><small>Plague Protocol · A Gremlins challenge</small></div><button class="btn ghost" id="restart">Restart</button></header><div class="rotate">↻ Rotate your phone<small>This escape room is designed for landscape play.</small></div><div class="scene-caption" id="scene-caption">Room 1 — The Infirmary</div><main class="wrap"><div class="room-hud"><span id="roomlabel">THE INFIRMARY</span></div><button class="btn ghost" type="button" id="bagbtn">🎒 Inventory</button><div class="scene-viewport" id="sceneviewport"><div class="scene" id="scene"></div></div><div class="toolbar" id="actions"></div><section class="panel" id="bagpanel"><h3>🎒 Inventory</h3><div class="items" id="inventory"></div></section><div class="panel small muted" id="status"></div></main><div id="modal"></div><script>
'use strict';const KEY='gremlins-plague-protocol-release-2026-10';const initial=()=>({room:1,items:[],notes:[],flags:{},brew:[],gate:[],glass:[null,null,null,null],selected:null,finished:false});let S;try{S={...initial(),...JSON.parse(localStorage.getItem(KEY)||'null')}}catch{S=initial()}if(!S||!S.flags)S=initial();const save=()=>localStorage.setItem(KEY,JSON.stringify(S));const has=x=>S.items.includes(x);const add=x=>{if(!has(x))S.items.push(x);save()};const flag=x=>!!S.flags[x];const setflag=x=>{S.flags[x]=true;save()};const note=(title,body)=>{if(!S.notes.some(n=>n.title===title))S.notes.push({title,body});save()};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const btn=(text,fn,disabled=false)=>`<button class="btn" ${disabled?'disabled':''} data-fn="${fn}">${esc(text)}</button>`;const close=()=>{document.getElementById('modal').innerHTML=''};const show=(title,body,buttons='')=>{document.getElementById('modal').innerHTML=`<div class="overlay"><div class="dialog" role="dialog" aria-modal="true"><h2>${title}</h2>${body}<footer>${buttons||btn('Close','close')}</footer></div></div>`};const msg=(title,body)=>show(title,`<p>${body}</p>`);const table=(heads,rows)=>`<table><tr>${heads.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table>`;
const objects={1:[['Patient Records',17,64,7,12,'ledger'],['Patients',38,38,7,12,'patients'],['Medicine Chest',70,76,7,12,'chest'],['Door to Apothecary',85,37,7,12,'door'],['Tapestry',9,23,7,12,'tapestry'],['Bloodstained Cloth',41,57,7,12,'cloth'],['Treatment Guide',13,82,7,12,'guide'],['Bed Markings',52,28,7,12,'marks']],2:[['Ingredient Jars',6,12,45,33,'jars'],['Experiment Journal',51,42,26,24,'experiments'],['Recipe Notes',61,67,24,19,'recipes'],['Cauldron',81,29,18,54,'cauldron'],['Brewing Inscription',80,63,18,20,'breworder'],['Green Phial',3,38,16,25,'phial']],3:[['Sick Guard',3,42,28,35,'guard'],['Guard’s Desk',29,67,31,27,'desk'],['Pink Cat',53,76,25,21,'cat'],['Supply Crates',39,31,30,35,'crates'],['Gate Mechanism',69,21,30,59,'gate'],['Old Watch Ledger',30,64,17,15,'oldwatch'],['Rusty Key',4,69,12,19,'rusty']],4:[['Stained Glass Panels',68,14,28,48,'window'],['Quarantine Notice',8,62,22,28,'notice'],['Mechanism',54,58,29,26,'mechanism'],['Lever',84,61,15,28,'lever'],['Door',43,78,29,20,'exitdoor']]};const descriptions={1:'Find who swallowed the false cure. Unlock the medicine chest.',2:'Investigate the experiments. Brew the only effective antidote.',3:'Revive the guard, repair the gate, and restore the watch.',4:'Restore the four witnesses around the cross. Break the last seal.'};const hotspotPositions={"1": [["ledger", 22, 83], ["patients", 41, 47], ["chest", 83, 85], ["door", 85, 38], ["tapestry", 7, 43], ["cloth", 36, 74], ["guide", 15, 80], ["marks", 55, 29]], "2": [["jars", 14, 30], ["experiments", 42, 37], ["recipes", 58, 85], ["cauldron", 65, 52], ["breworder", 72, 65], ["phial", 91, 53]], "3": [["guard", 22, 68], ["desk", 65, 63], ["cat", 63, 75], ["crates", 92, 76], ["gate", 77, 42], ["oldwatch", 17, 83], ["rusty", 47, 45]], "4": [["window", 51, 25], ["notice", 24, 36], ["mechanism", 54, 75], ["lever", 77, 65], ["exitdoor", 13, 52]]};const sceneNames=['','The Infirmary','The Apothecary','The Quarantine','The Ritual Chamber'];
const magnify='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m14.5 14.5 6 6"/></svg>';
const padlock='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>';
const arrow='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h17m-7-7 7 7-7 7"/></svg>';
function render(){document.getElementById('roomlabel').textContent=sceneNames[S.room];document.getElementById('scene-caption').textContent='Room '+S.room+' — '+sceneNames[S.room];document.getElementById('scene').innerHTML=`<img alt="${esc(sceneNames[S.room])}" src="assets/room${S.room}.webp">`+objects[S.room].map(([name,x,y,w,h,id])=>{const p=hotspotPositions[S.room].find(v=>v[0]===id);if(!p)return '';const kind=(id==='door'||id==='exitdoor')?arrow:(id==='chest'||id==='gate')?padlock:magnify;return `<button class="hot" aria-label="${esc(name)}" title="${esc(name)}" style="left:${p[1]}%;top:${p[2]}%" data-obj="${id}">${kind}</button>`}).join('');document.getElementById('inventory').innerHTML=S.items.length?S.items.map(x=>`<span class="pill">${esc(x)}</span>`).join(''):'<span class="muted">Nothing yet.</span>';save()}

function advance(n){S.room=n;S.brew=[];S.gate=[];close();render();window.scrollTo(0,0);msg(['','Infirmary','The Apothecary','The Quarantine','The Ritual Chamber'][n],descriptions[n])}
const mappings={Crow:4,Moon:8,Sun:1,Serpent:6,Gravebloom:7,Frostmoss:2,Emberroot:5,Silverleaf:9};
function inspect(id){switch(S.room){case 1:return room1(id);case 2:return room2(id);case 3:return room3(id);case 4:return room4(id)}}
function room1(id){switch(id){case'ledger':note('Patient ledger','Aldric — blackened fingers — Silverleaf — Moon bed. Branna — burning fever — Emberroot — Sun bed. Corvin — violent coughing — Gravebloom — Crow bed. Daria — shivering — Frostmoss — Serpent bed.');return show('Healer’s Ledger',table(['Patient','Symptoms','Given','Bed'],[['Aldric','Blackened fingers','Silverleaf','Moon'],['Branna','Burning fever','Emberroot','Sun'],['Corvin','Violent coughing','Gravebloom','Crow'],['Daria','Shivering','Frostmoss','Serpent']])) ;case'guide':note('Treatment guide','Blackened fingers → Silverleaf; burning fever → Emberroot; shivering → Gravebloom; violent coughing → Frostmoss.');return show('Treatment Guide',table(['Symptom','Correct treatment'],[['Blackened fingers','Silverleaf'],['Burning fever','Emberroot'],['Shivering','Gravebloom'],['Violent coughing','Frostmoss']]));case'patients':note('Bedside evidence','Corvin: empty cup stained with Gravebloom. Daria: sealed, unopened Frostmoss packet. Night healer: “Only one patient swallowed the wrong medicine. The other never received their dose.”');return show('The Patients','<p>Corvin’s bedside cup is empty, with dark Gravebloom residue at its base.</p><p>Beside Daria lies an <b>unopened</b>, sealed Frostmoss packet.</p><p>A night healer’s note reads: <i>“Only one patient swallowed the wrong medicine. The other never received their dose.”</i></p>');case'marks':note('Number carvings','Bed marks: Crow 4, Moon 8, Sun 1, Serpent 6. Remedies: Gravebloom 7, Frostmoss 2, Emberroot 5, Silverleaf 9.');return show('Carvings in the Beams',table(['Mark','Number'],Object.entries(mappings)));case'chest':return show('Locked Medicine Chest','<p>Engraved on the lock:</p><div class="notice">For the patient who <b>swallowed</b> the false cure: first the mark upon their bed; second the medicine they were given; third the medicine that should have saved them.</div><p>Enter the three digits:</p><input id="code" inputmode="numeric" maxlength="3" pattern="[0-9]*" placeholder="000" style="width:100%;padding:13px;font-size:22px;background:#120f0e;color:white;border:1px solid #9b774c;border-radius:6px">',btn('Unlock chest','chestcheck')+btn('Close','close'));case'door':if(!has('Apothecary key'))return msg('Locked Door','A heavy iron lock bars the apothecary. Somewhere in this room there must be a key.');return advance(2);case'tapestry':return msg('Suspicious Tapestry','A faded tapestry depicts a plague doctor riding a goose. Behind it? Stone. Just stone.');case'cloth':return msg('Bloodstained Cloth','A gruesome rag. It smells of old iron and questionable laundry habits. Nothing is concealed beneath it.')}}
function room2(id){switch(id){case'jars':return show('Six Ingredient Jars',table(['Ingredient','Appearance'],[['Silverleaf','Pale leaves with metallic veins'],['Gravebloom','Purple flowers smelling of damp earth'],['Emberroot','Twisted red roots, warm to the touch'],['Frostmoss','Blue-grey moss, unnaturally cold'],['Nightshade','Black berries in dark liquid'],['Moonwater','Clear liquid with a silvery shimmer']]));case'experiments':{const b='Each ingredient has one primary effect; no two share an effect. Each successful property in a mixture comes from at least one of its ingredients. Effects do not cancel.';note('Experiment journal',b+' Trials: I Silverleaf+Gravebloom: blood yes, spread no, stable no. II Gravebloom+Emberroot: no/no/no. III Emberroot+Frostmoss: no/yes/no. IV Frostmoss+Nightshade: no/yes/no. V Nightshade+Moonwater: no/no/yes. VI Moonwater+Silverleaf: yes/no/yes.');return show('The Experiment Journal',`<p>${b}</p>`+table(['Trial','Ingredients','Blood','Spread','Stable'],[['I','Silverleaf + Gravebloom','✓','–','–'],['II','Gravebloom + Emberroot','–','–','–'],['III','Emberroot + Frostmoss','–','✓','–'],['IV','Frostmoss + Nightshade','–','✓','–'],['V','Nightshade + Moonwater','–','–','✓'],['VI','Moonwater + Silverleaf','✓','–','✓']]));}case'recipes':note('Old recipes','Healer’s Mercy: Silverleaf, Gravebloom, Moonwater. Crimson Remedy: Emberroot, Frostmoss, Moonwater. Silent Cure: Silverleaf, Frostmoss, Nightshade. The Silent Cure made patients look well, but the illness returned.');return show('The Old Recipe Book',table(['Recipe','Ingredients'],[['Healer’s Mercy','Silverleaf, Gravebloom, Moonwater'],['Crimson Remedy','Emberroot, Frostmoss, Moonwater'],['Silent Cure','Silverleaf, Frostmoss, Nightshade']])+'<p><i>“The Silent Cure fooled us. Their skin cleared, yet the sickness returned before dawn.”</i></p>');case'breworder':note('Brewing order','The new plague darkens the blood, spreads beneath the skin, and spoils medicine. Cauldron: first cleanse corruption, next halt the spread, last preserve the mixture.');return msg('Cauldron Inscription','The new plague blackens the blood, spreads beneath the skin, and spoils the remedy.<div class="notice">First, cleanse what has been corrupted.<br>Next, halt what seeks to spread.<br>Last, preserve what would otherwise perish.</div>');case'phial':return msg('The Green Phial','“ORIGINAL PLAGUE CURE” reads the label. Below, in smaller handwriting: “Results pending.” The liquid has eaten through the cork. Probably best not.');case'cauldron':return brewUI()}}
const ing=['Silverleaf','Gravebloom','Emberroot','Frostmoss','Nightshade','Moonwater'];function brewUI(message=''){show('The Brewing Cauldron','<p>Select three different ingredients <b>in order</b>.</p><div class="slots">'+[0,1,2].map(i=>`<div class="slot">${i+1}. ${esc(S.brew[i]||'Empty')}</div>`).join('')+'</div><div class="choice">'+ing.map(x=>btn(x,'ingredient:'+x,S.brew.includes(x)||S.brew.length>=3)).join('')+'</div>'+(message?`<div class="notice">${message}</div>`:''),btn('Brew','brewcheck',S.brew.length!==3)+btn('Empty cauldron','brewreset')+btn('Close','close'))}
function room3(id){switch(id){case'guard':if(flag('guard'))return msg('The Watchman','“I told you, the key is under the beast’s blankets. And don’t follow the old watch orders!”');if(!has('Antidote'))return msg('Sick Guard','The guard coughs weakly. He needs medicine — something stronger than the old cures.');setflag('guard');return msg('The Guard Revives','You administer the antidote. The guard blinks awake: <i>“The watchman’s seal is locked in my desk. I hid the key where the beast sleeps. The watch orders changed after the outbreak!”</i>');case'cat':if(!flag('guard'))return msg('The Pink Menace','The pink cat hisses and buries itself deeper into its blankets. Perhaps someone knows what it is guarding.');if(has('Iron key'))return msg('Pink Cat','The cat looks offended that you stole its shiny treasure.');add('Iron key');render();return msg('Under the Blankets','The cat swipes at your fingers, but you retrieve a <b>small iron key</b>. It is now in your inventory.');case'desk':if(!has('Iron key'))return msg('Locked Desk','The guard’s drawer is locked. A narrow iron keyhole is visible.');if(!flag('desk')){setflag('desk');add('Watchman’s seal');note('Revised watch orders','The Crow stands immediately before the Moon. The Moon takes the final watch. The old ledger is obsolete.');note('Seal engraving','The Serpent stands immediately before the Sun.');render()}return show('Guard’s Desk — Unlocked','<p>Inside you find the <b>watchman’s seal</b> and revised orders:</p><div class="notice">The Crow stands immediately before the Moon. The Moon takes the final watch.</div><p>On the reverse of the seal:</p><div class="notice">The Serpent stands immediately before the Sun.</div><p>A second, tiny engraving reads: <i>“The golden witness keeps vigil above all others.”</i></p>');case'oldwatch':note('Old watch ledger','Before the plague: Sun first, Serpent last, Crow before Moon. Clearly marked OBSOLETE.');return msg('Old Guard Ledger','<i>“Before the plague, the Sun began the watch, and the Serpent ended it. The Crow stood before the Moon.”</i><p>A red wax stamp reads <b>OBSOLETE — DO NOT USE</b>.</p>');case'crates':if(has('Brass cog'))return msg('Supply Crates','Only splinters and a loaf of bread with ambitions of sentience remain.');add('Brass cog');render();return msg('False Bottom','You lift a loose plank beneath the crates and find a <b>brass cog</b>. Also some mouldy bread. The bread stays.');case'rusty':return msg('Rusty Key','You try a corroded key hanging beside the hearth. It opens a tiny chest containing… another rusty key. This is going nowhere.');case'gate':if(!has('Brass cog'))return msg('Broken Gate','One brass cog is missing from the mechanism. It cannot turn.');if(!has('Watchman’s seal'))return msg('Sealed Gate','The cog fits! But the gate still requires the watchman’s seal.');return gateUI()}}
const syms=['Sun','Moon','Crow','Serpent'];function gateUI(message=''){show('The Watchman’s Gate','<p>Fit the cog, arrange the four watches from first to last, and turn the seal.</p><div class="slots">'+[0,1,2,3].map(i=>`<div class="slot">${i+1}. ${S.gate[i]||'—'}</div>`).join('')+'</div><div class="choice">'+syms.map(x=>btn(x,'symbol:'+x,S.gate.includes(x)||S.gate.length>=4)).join('')+'</div>'+(message?`<div class="notice">${message}</div>`:''),btn('Turn seal','gatecheck',S.gate.length!==4)+btn('Reset symbols','gatereset')+btn('Close','close'))}
function room4(id){switch(id){case'notice':return msg('Quarantine Notice','BY ORDER OF THE WARDEN: <i>“The sanctuary shall remain sealed until the four witnesses are restored. Let no plague pass beyond these doors.”</i>');case'window':case'mechanism':return glassUI();case'lever':return glassUI('The lever will only release the door when the stained-glass witnesses are restored.');case'exitdoor':return msg('The Front Doors','The doors are sealed by the mechanism beneath the stained-glass cross. There is no other way out.')}}
const glassColors=['Gold','Red','Green','Blue'];const glassHex={Gold:'#c9a044',Red:'#b8454c',Green:'#428d6b',Blue:'#4073b9'};function glassUI(message=''){const pieces=S.glass;show('The Four Witnesses','<p>Place the four coloured panels around the cross. Select a colour, then a position. Tap a filled position with no colour selected to remove it.</p><div class="choice">'+glassColors.map(c=>`<button class="btn ${S.selected===c?'active':''}" data-fn="color:${c}" style="border-bottom:5px solid ${glassHex[c]}">${c}</button>`).join('')+'</div><div class="slots"><div class="slot">✝ Cross</div></div><div class="choice">'+['Top','Right','Bottom','Left'].map((x,i)=>btn(x+': '+(pieces[i]||'Empty'),'place:'+i)).join('')+'</div><p class="small muted">Clockwise: Top → Right → Bottom → Left.</p>'+(message?`<div class="notice">${message}</div>`:''),btn('Pull the lever','glasscheck',pieces.some(x=>!x))+btn('Reset glass','glassreset')+btn('Close','close'))}
function action(fn){if(fn==='close'){close();return}if(fn.startsWith('obj:'))return inspect(fn.slice(4));if(fn.startsWith('note:')){const n=S.notes[+fn.slice(5)];return show(esc(n.title),`<div class="ledger-lines">${esc(n.body).split(/(?<=\.)\s+(?=[A-Z])/).map(line=>`<p>${line}</p>`).join('')}</div>`)}if(fn==='chestcheck'){const v=document.getElementById('code')?.value;if(v==='472'){add('Apothecary key');add('Torn quarantine document');note('Quarantine fragment','“The crimson witness shall forever face the azure witness across the holy cross.” Red and Blue must be opposite.');setflag('chest');render();return msg('Chest Unlocked!','Inside: an <b>apothecary key</b> and a torn quarantine document. The document reads: <i>“The crimson witness shall forever face the azure witness across the holy cross.”</i>')}return msg('The Lock Holds','The chest refuses to open. Recheck who actually swallowed the wrong medicine, and the number carvings.')}if(fn.startsWith('ingredient:')){S.brew.push(fn.slice(11));save();return brewUI()}if(fn==='brewreset'){S.brew=[];save();return brewUI()}if(fn==='brewcheck'){if(S.brew.join('|')==='Silverleaf|Frostmoss|Moonwater'){add('Antidote');add('Sanctuary map fragment');note('Stained-glass diagram','Follow the sun’s path clockwise around the cross. The emerald witness comes directly after the crimson. Green is immediately clockwise after Red.');setflag('brewed');render();return show('The True Cure!','<p>The antidote glimmers silver. A concealed drawer clicks open.</p><p>You collect the <b>antidote</b> and a <b>stained-glass diagram</b>:</p><div class="notice">Follow the sun’s path clockwise around the cross. The emerald witness comes directly after the crimson.</div>',btn('Enter the Main Hall','next:3'))}const bad=S.brew.includes('Nightshade')?'The potion turns purple. Then your skin turns purple. Not ideal.':S.brew.includes('Emberroot')?'The cauldron erupts. Your eyebrows have escaped before you.':'The brew curdles into a foul sludge. Even Eddie would refuse to drink it.';S.brew=[];save();return brewUI(bad)}if(fn.startsWith('symbol:')){S.gate.push(fn.slice(7));save();return gateUI()}if(fn==='gatereset'){S.gate=[];save();return gateUI()}if(fn==='gatecheck'){if(S.gate.join('|')==='Serpent|Sun|Crow|Moon'){note('Golden witness','A tiny engraving on the watchman’s seal: “The golden witness keeps vigil above all others.” Gold belongs at the top of the cross.');setflag('gate');render();return show('The Gate Opens','<p>The cog catches. The seal turns. The heavy iron gate groans open.</p><p>On the reverse of the seal you notice another engraving:</p><div class="notice">The golden witness keeps vigil above all others.</div>',btn('Enter the Sanctuary Entrance','next:4'))}S.gate=[];save();return gateUI('The mechanism jams and an enormous bell rings. Somewhere, a Gremlin swears.')}if(fn.startsWith('color:')){S.selected=fn.slice(6);save();return glassUI()}if(fn.startsWith('place:')){let i=+fn.slice(6);if(S.selected){S.glass=S.glass.map(c=>c===S.selected?null:c);S.glass[i]=S.selected;S.selected=null}else S.glass[i]=null;save();return glassUI()}if(fn==='glassreset'){S.glass=[null,null,null,null];S.selected=null;save();return glassUI()}if(fn==='glasscheck'){if(S.glass.join('|')==='Gold|Red|Green|Blue'){S.finished=true;save();render();return show('YOU ESCAPED THE SANCTUARY!','<div class="win"><p>Against all odds, terrible medicine and one extremely judgmental pink cat, you survived.</p><p class="muted">YOUR ESCAPE CODE</p><div class="code">GREMLIN-ESCAPED</div><p><b>DM THE EVIL OVERLORD</b> your escape code to claim your victory. 😈</p><p class="small muted">First correct DM wins, subject to the competition rules.</p></div>',btn('Copy escape code','copycode')+btn('Close','close'))}return glassUI('The glass flashes and the doors stay sealed. The bell tolls. Revisit your collected clues.')}if(fn==='copycode'){navigator.clipboard?.writeText('GREMLIN-ESCAPED').then(()=>msg('Copied!','DM the Evil Overlord your escape code.')).catch(()=>msg('Your Code','GREMLIN-ESCAPED — copy this and DM the Evil Overlord.'));return}if(fn.startsWith('next:'))return advance(+fn.slice(5))}
document.addEventListener('click',e=>{const t=e.target.closest('[data-fn],[data-obj]');if(!t)return;if(t.dataset.obj)inspect(t.dataset.obj);else action(t.dataset.fn)});document.getElementById('bagbtn').onclick=()=>document.getElementById('bagpanel').classList.toggle('open');document.getElementById('restart').onclick=()=>{show('Restart the Challenge?','<p>This will erase your saved progress on this device.</p>',btn('Yes, start over','confirmrestart')+btn('Cancel','close'))};const originalAction=action;action=function(fn){if(fn==='confirmrestart'){S=initial();save();close();render();return msg('A New Victim','You wake in the infirmary. The plague bells are ringing. Again.')}return originalAction(fn)};render();if(S.finished)msg('You Escaped!','Your escape code is <b>GREMLIN-ESCAPED</b>. DM the Evil Overlord!');
</script></body></html>
